<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ポン出し 映像出力</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  #still, #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #still { display: none; }
  #video { opacity: 0; }
  #video.is-on { opacity: 1; }
  #info { position: fixed; left: 16px; bottom: 12px; font: 12px sans-serif; color: rgba(255,255,255,.35); display: none; }
  body.is-preview #info { display: block; }
</style>
</head>
<body>
<div id="stage">
  <img id="still" alt="">
  <video id="video" muted playsinline preload="auto"></video>
</div>
<div id="info">ポン出し 映像出力（確認用の小さいウィンドウ）</div>
<script src="store.js?v=0.10.0"></script>
<script src="video.js?v=0.10.0"></script>
</body>
</html>
